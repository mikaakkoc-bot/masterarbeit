  --sea:#0D4652; --sea-deep:#082F38; --sun:#FFE14D; --sun-deep:#F2C531; --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.86); --card-ink:#2B2008;
  --round:Fredoka,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;

}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sea-deep);color:var(--ink);font-family:var(--round);font-weight:500;overflow-x:hidden}
p,h1{margin:0}

.bg{position:fixed;inset:-40px;z-index:0;background:var(--sea) var(--img) center / cover no-repeat;filter:blur(22px) saturate(1.2)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,47,56,.55),rgba(8,47,56,.35) 40%,rgba(8,47,56,.75))}

.page{position:relative;z-index:1;min-height:100%;width:100%;max-width:600px;margin-inline:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3.2vh,28px);
  padding-block:clamp(24px,5vh,56px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));text-align:center}

.eyebrow{font-weight:600;font-size:13px;letter-spacing:.22em;color:var(--sun)}
h1{font-weight:600;font-size:clamp(32px,8.6vw,52px);line-height:1.05;text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.head{display:flex;flex-direction:column;align-items:center;gap:8px}

/* Envelope: the meme waits inside; a checkbox + label opens it, so it works without scripts */
.post{position:relative;isolation:isolate;width:min(100%, calc(52vh * .95));aspect-ratio:1 / 1.05}
.toggle{position:absolute;left:50%;top:50%;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.tapzone{position:absolute;inset:0;z-index:8;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:12px}
.toggle:focus-visible ~ .tapzone{outline:3px solid var(--sun);outline-offset:4px}
.hint{position:absolute;left:0;right:0;top:9%;z-index:7;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:clamp(17px,4.6vw,21px);color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.4)}
.hint svg{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.e-back,.e-pocket,.e-flapw{position:absolute;left:0;right:0}
.e-back{top:41%;bottom:0;z-index:1;border-radius:8px;background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.4) 0 5px,transparent 6px) 0 0/44px 44px,radial-gradient(circle at 70% 70%,rgba(255,255,255,.28) 0 3px,transparent 4px) 0 0/28px 28px,#17707F;box-shadow:0 22px 40px -16px rgba(0,0,0,.6)}
.e-pocket{top:41%;bottom:0;z-index:3;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);border-radius:0 0 8px 8px;background:linear-gradient(118deg,transparent 49.6%,rgba(160,110,0,.16) 50%,transparent 50.6%),linear-gradient(62deg,transparent 49.6%,rgba(160,110,0,.16) 50%,transparent 50.6%),linear-gradient(180deg,#FFEA6E,#F5CF35)}
.e-flapw{top:41%;height:32.5%;z-index:4;transform-origin:50% 0;transform:perspective(800px) rotateX(0deg);filter:drop-shadow(0 6px 6px rgba(80,55,0,.35))}
.e-flap{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#FFF39A,#FFE04A)}
.seal{position:absolute;left:50%;top:73.5%;z-index:5;width:clamp(50px,14vw,66px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#FFFFFF;background:radial-gradient(circle at 35% 30%,#FF8C82,#E5484D 58%,#B5303A);box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 -3px 5px rgba(0,0,0,.22)}
.card{position:absolute;left:4%;width:92%;top:43%;height:72.4%;z-index:2;border-radius:14px;border:4px solid #FFFFFF;background:var(--img) center / cover no-repeat;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);clip-path:inset(0 0 21.3% 0 round 12px)}
.toggle:checked ~ .tapzone{display:none}
.toggle:checked ~ .hint{animation:fade-out .3s ease forwards}
.toggle:checked ~ .seal{animation:seal-off .35s ease forwards}
.toggle:checked ~ .e-flapw{animation:flap-open .9s cubic-bezier(.5,0,.25,1) .15s forwards}
.toggle:checked ~ .card{animation:card-out 2.4s linear forwards}
@keyframes fade-out{to{opacity:0}}
@keyframes seal-off{to{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
@keyframes flap-open{0%{transform:perspective(800px) rotateX(0deg);z-index:4}49%{z-index:4}50%{z-index:1}100%{transform:perspective(800px) rotateX(180deg);z-index:1}}
@keyframes card-out{
  0%{transform:translateY(0);clip-path:inset(0 0 21.3% 0 round 12px);z-index:2}
  40%{transform:translateY(0);clip-path:inset(0 0 21.3% 0 round 12px);z-index:2;animation-timing-function:cubic-bezier(.3,.7,.2,1)}
  80%{transform:translateY(-59.4%);clip-path:inset(0 0 0 0 round 12px);z-index:2}
  81%{transform:translateY(-59.4%);clip-path:inset(-60px round 12px);z-index:6;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
  100%{transform:translateY(-59.4%) rotate(-1.5deg) scale(1.04);clip-path:inset(-60px round 12px);z-index:6}
}

.cells{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2.4vw,12px)}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:clamp(12px,3.2vw,18px) 4px clamp(10px,2.8vw,14px);border-radius:18px;background:var(--sun);color:var(--card-ink);box-shadow:0 5px 0 var(--sun-deep),0 12px 24px -10px rgba(0,0,0,.5)}
.num{font-weight:600;font-size:clamp(32px,9.6vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.lbl{font-weight:600;font-size:clamp(9px,2.4vw,12px);letter-spacing:.1em}
.date{font-size:clamp(15px,4vw,18px);color:var(--ink-soft)}
.date strong{color:var(--sun);font-weight:600}

.done{display:none;flex-direction:column;align-items:center;gap:6px}
.is-done .cells,.is-done .noch{display:none}
.is-done .done{display:flex}
.done strong{font-weight:600;font-size:clamp(40px,11vw,64px);line-height:1.05;color:var(--sun)}

.confetti{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;display:none}
.is-done .confetti{display:block}
.confetti i{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){.hint svg,.confetti i{animation:none}.toggle:checked ~ .e-flapw,.toggle:checked ~ .card,.toggle:checked ~ .seal{animation-duration:.01s;animation-delay:0s}}
</style>

<div class="bg" aria-hidden="true"></div>

<main class="page" id="page">
  <header class="head">
    <p class="eyebrow">COUNTDOWN ZUR ABGABE</p>
    <h1>Meine Masterarbeit</h1>
  </header>

  <div class="post">
    <input type="checkbox" id="auf" class="toggle" autocomplete="off" aria-label="Umschlag öffnen">
    <p class="hint" aria-hidden="true">Tipp auf den Umschlag<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5 12l7 7 7-7"/></svg></p>
    <div class="e-back" aria-hidden="true"></div>
    <div class="card" role="img" aria-label="SpongeBob unter einem Regenbogen: Yay, we did it!"></div>
    <div class="e-pocket" aria-hidden="true"></div>
    <div class="e-flapw" aria-hidden="true"><div class="e-flap"></div></div>
    <div class="seal" aria-hidden="true"><svg width="58%" height="58%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 4 2 9l10 5 10-5Z" fill="currentColor"/><path d="M6 11.2V16c3.5 2.6 8.5 2.6 12 0v-4.8"/><path d="M21 9.5v5.5"/></svg></div>
    <label for="auf" class="tapzone" aria-hidden="true"></label>
  </div>

  <p class="date noch">Abgabe am <strong>Donnerstag, 7. Januar 2027</strong></p>

  <div class="cells" role="timer" aria-live="off">
    <div class="cell"><span class="num" id="d">--</span><span class="lbl" id="d-l">TAGE</span></div>
    <div class="cell"><span class="num" id="h">--</span><span class="lbl" id="h-l">STUNDEN</span></div>
    <div class="cell"><span class="num" id="m">--</span><span class="lbl" id="m-l">MINUTEN</span></div>
    <div class="cell"><span class="num" id="s">--</span><span class="lbl" id="s-l">SEKUNDEN</span></div>
  </div>

  <div class="done">
    <strong>Abgegeben!</strong>
    <p class="date">Herzlichen Glückwunsch, du hast es geschafft.</p>
  </div>
</main>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  // Abgabe: Donnerstag, 7. Januar 2027, 23:59 Uhr (deutsche Zeit)
  var ZIEL = Date.parse("2027-01-07T23:59:00+01:00");
  var page = document.getElementById("page");
  var units = [["d", 864e5, 0, "TAG", "TAGE"], ["h", 36e5, 24, "STUNDE", "STUNDEN"], ["m", 6e4, 60, "MINUTE", "MINUTEN"], ["s", 1e3, 60, "SEKUNDE", "SEKUNDEN"]]
    .map(function (x) { return { n: document.getElementById(x[0]), l: document.getElementById(x[0] + "-l"), ms: x[1], mod: x[2], one: x[3], many: x[4] }; });
  var timer;
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function feiern() {
    page.classList.add("is-done");
    document.body.classList.add("is-done");
    var box = document.getElementById("confetti");
    var farben = ["#FF5A5F", "#FF9F1C", "#FFE14D", "#2EC4B6", "#3A86FF", "#9B5DE5", "#FFFFFF"];
    for (var i = 0; i < 60; i++) {
      var c = document.createElement("i");
      c.style.left = (Math.random() * 100) + "%";
      c.style.background = farben[i % farben.length];
      c.style.animationDuration = (3.5 + Math.random() * 4) + "s";
      c.style.animationDelay = (-Math.random() * 7) + "s";
      box.appendChild(c);
    }
  }
  function tick() {
    var diff = ZIEL - Date.now();
    if (diff <= 0) { clearInterval(timer); feiern(); return; }
    units.forEach(function (u) {
      var v = Math.floor(diff / u.ms); if (u.mod) v = v % u.mod;
      u.n.textContent = u.mod ? pad(v) : String(v);
      u.l.textContent = v === 1 ? u.one : u.many;
    });
  }
  tick();
  timer = setInterval(tick, 1000);
})();
</script>

</body>
</html>
